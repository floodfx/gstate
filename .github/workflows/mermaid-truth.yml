name: Mermaid truth

# The pinned Mermaid CLI parses and renders each golden .mmd. Tests also
# require a nonempty checked-in SVG for human review. Coordinates are not
# byte-compared; this workflow checks renderability and artifact presence.

on:
  pull_request:
    paths:
      - 'mermaid.go'
      - 'internal/mermaid/**'
      - 'mermaid_*_test.go'
      - 'testdata/golden/mermaid/**'
      - '.github/workflows/mermaid-truth.yml'
      - 'justfile'
  push:
    branches: [main]
    paths:
      - 'mermaid.go'
      - 'internal/mermaid/**'
      - 'mermaid_*_test.go'
      - 'testdata/golden/mermaid/**'
      - '.github/workflows/mermaid-truth.yml'
      - 'justfile'

permissions:
  contents: read

jobs:
  truth:
    name: parse + render via mermaid-cli
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Run truth-tier tests
        run: go test -tags=mermaid_truth -count=1 -run 'TestMermaid(ParsesWithMermaidCli|SvgsExist)' .
